name: Server Distribution

on:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'
      - 'src/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'scripts/docker-smoke.sh'
      - 'scripts/package-server-release.py'
      - '.github/workflows/server-distribution.yml'
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  container-smoke:
    name: Docker build + persistence smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Smoke-test container persistence
        run: bash scripts/docker-smoke.sh

  server-binaries:
    name: server binary ${{ matrix.target }}
    runs-on: ${{ matrix.host }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - host: windows-latest
            target: x86_64-pc-windows-msvc
          - host: macos-14
            target: x86_64-apple-darwin
          - host: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: server-${{ matrix.target }}

      - name: Build standalone server
        run: cargo build --locked --release --no-default-features --features bins --bin genesis-db-server --target ${{ matrix.target }}

      - name: Package release archive + SHA-256
        run: python scripts/package-server-release.py --target ${{ matrix.target }}

      - name: Upload server artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  release-assets:
    name: Attach standalone server binaries to GitHub Release
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    needs: server-binaries
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: server-*
          path: release-dist
          merge-multiple: true

      - name: Create/update release and upload server assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            # Another release workflow may be creating the same tag at the same
            # time. If that race wins after our view, tolerate create's failure
            # and verify the release exists before uploading.
            gh release create "$TAG" --title "$TAG" --generate-notes || true
          fi
          gh release view "$TAG" >/dev/null
          mapfile -d '' FILES < <(find release-dist -type f -print0)
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "no server release assets found" >&2
            exit 1
          fi
          gh release upload "$TAG" "${FILES[@]}" --clobber

  container-publish:
    name: Publish server image to GHCR
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    needs: container-smoke
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/freshair129/genesisblock
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=beta,enable=${{ contains(github.ref_name, '-') }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            VCS_REF=${{ github.sha }}
          provenance: mode=max
          sbom: true
