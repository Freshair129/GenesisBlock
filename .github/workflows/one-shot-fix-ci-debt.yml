name: One-shot fix remaining CI debt

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'agent/tech-debt-hardening'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tech-debt-hardening
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cbindgen
        run: cargo install cbindgen --locked
      - name: Repair source and tests
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          robustness = Path('tests/robustness.rs')
          text = robustness.read_text(encoding='utf-8')
          cleaned = text.replace('\u00ad', '')
          if cleaned == text:
              raise SystemExit('expected at least one soft hyphen in tests/robustness.rs')
          robustness.write_text(cleaned, encoding='utf-8')

          test_file = Path('__test__/db.test.mjs')
          text = test_file.read_text(encoding='utf-8')
          text = text.replace("import path from 'node:path';\n", "import path from 'node:path';\nimport { spawnSync } from 'node:child_process';\n", 1)
          pattern = re.compile(
              r"test\('NAPI: edge survives saveState \+ reopen', async \(\) => \{.*?\n\}\);",
              re.DOTALL,
          )
          replacement = r'''test('NAPI: edge survives saveState + reopen', async () => {
  const dbPath = tempDb('edge-persist');
  try {
    // Run the writer in a separate process so exiting it deterministically
    // drops the native handle and releases the exclusive ownership lock.
    // JavaScript block scope alone does not guarantee native finalization.
    const writer = spawnSync(
      process.execPath,
      [
        '--input-type=module',
        '-e',
        `import { GenesisDatabase } from ${JSON.stringify(new URL('../index.js', import.meta.url).href)};
         const db = GenesisDatabase.open({ path: ${JSON.stringify(dbPath)} });
         await db.addNode({ id: 'src', labels: [] });
         await db.addNode({ id: 'dst', labels: [] });
         await db.addEdge({ from: 'src', to: 'dst', rel: 'LINKS' });
         await db.saveState();`,
      ],
      { encoding: 'utf8' },
    );
    assert.strictEqual(
      writer.status,
      0,
      `writer process failed: ${writer.stderr || writer.stdout}`,
    );

    const db = GenesisDatabase.open({ path: dbPath });
    const neighbors = await db.neighbors('src', { depth: 1, rel: 'LINKS', direction: 'out' });
    assert.strictEqual(neighbors.length, 1, 'edge must survive saveState + reopen');
    assert.strictEqual(neighbors[0].node.id, 'dst');
  } finally {
    cleanup(dbPath);
  }
});'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'expected one edge persistence test, replaced {count}')
          test_file.write_text(text, encoding='utf-8')
          PY
      - name: Regenerate C header
        run: bash scripts/gen-header.sh
      - name: Format and commit
        run: |
          cargo fmt
          git rm .github/workflows/one-shot-fix-ci-debt.yml
          git add tests/robustness.rs __test__/db.test.mjs include/genesisdb.h
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(ci): release NAPI handles and refresh generated contracts"
          git push origin HEAD:agent/tech-debt-hardening
