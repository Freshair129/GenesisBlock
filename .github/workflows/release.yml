# Build the NAPI native addon for every published target and publish to npm.
# Also publishes the two other mobile-SDK package-manager surfaces on the same
# tag (issue #125): genesisdb-android to GitHub Packages, react-native-genesisdb
# to npm. GenesisBlockDB.xcframework is NOT published here — it ships as a raw
# GitHub Release asset via a manual step (see ios/README.md "Prebuilt
# xcframework"), not through a package-manager job, since CocoaPods needs no
# Trunk publish for it (react-native-genesisdb's podspec fetches it directly —
# see that podspec's comment) and a real SPM-registry path is deferred.
#
# The genesisdb-android `.aar` IS attached here, by the same `android-publish`
# job that builds it with `--release` (see that job's "Attach .aar" step). It
# used to be uploaded by hand, which is how a DEBUG .aar — 281 MB of native
# libs, 78% DWARF — ended up on the v0.2.0 release. A guard step now fails the
# job if any `.so` still carries `.debug_*` sections. The xcframework has the
# same manual-upload exposure and the same history (a Windows-zipped asset
# broke SwiftPM extraction); `mobile-build.yml`'s `ios-xcframework` job now
# produces a correctly-attributed zip artifact for it, but attaching it is
# still manual — worth closing the same way.
#
# Triggered by pushing a version tag (e.g. v0.1.0-beta.1) or manually. A manual
# run accepts a `repair_tag` input to rebuild and replace an EXISTING release's
# assets from that tag's own source, without republishing to any registry.
#
# PREREQUISITES (must be set up once before this can actually publish):
#   1. Repo secret NPM_TOKEN — an npm automation token with publish rights to
#      the @freshair129 scope AND to the unscoped `react-native-genesisdb`
#      name (rn-npm-publish reuses this same secret). Settings → Secrets and
#      variables → Actions.
#   2. package.json `install: npm run build` forces a Rust compile on EVERY
#      consumer `npm install`. Before the first real publish, change it so
#      consumers receive the prebuilt platform addon instead of recompiling
#      (the napi optionalDependencies + index.js resolver already handle
#      runtime selection). CI here uses `--ignore-scripts` to avoid recompiling.
#   3. android-publish needs NO new secret — it authenticates to GitHub
#      Packages with the workflow's own auto-issued GITHUB_TOKEN (job-level
#      `packages: write` permission below), the same way every other job here
#      already gets `contents: read` for free.
#
# Flow (napi-rs v2): each matrix host builds one target's .node and uploads it;
# the publish job downloads them all, `napi artifacts` lays them into npm/<target>/
# package dirs, then `npm publish` runs — `prepublishOnly` (napi prepublish -t npm)
# publishes the per-platform packages and rewrites the main package's
# optionalDependencies.

name: Release (npm publish)

on:
  push:
    tags:
      - 'v*'
  # Dry run on PRs that touch release machinery or the things it packages.
  # Before this, release.yml had no non-mutating path: 30 of its 34 steps do
  # work that is safe on any commit, but the only trigger was a version tag, so
  # they were first executed at the moment of release. The record was 0 green
  # runs out of 5 tag pushes. A dry run cannot write to any registry (see
  # IS_RELEASE below) but exercises everything up to the write.
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'package.json'
      - 'modules.json'
      - 'Cargo.toml'
      - 'android/**'
      - 'react-native-genesisdb/**'
  workflow_dispatch:
    inputs:
      repair_tag:
        description: >-
          Existing tag whose release ASSETS should be rebuilt and replaced
          (e.g. v0.2.0). The job checks out that tag's source, so the asset
          matches the code it claims to be. Registry publishes are skipped in
          this mode — the version is already live. Leave empty for a normal run.
        required: false
        default: ''

permissions:
  contents: read
  id-token: write # npm provenance

env:
  # THE one switch that separates a real release from a dry run. Computed once,
  # here, rather than re-derived per step: the two conditional defects this file
  # has already produced both came from a mode's semantics being decided in more
  # than one place. Every irreversible step below guards on this being exactly
  # the string "true", so an unset or misspelled value fails CLOSED - it does
  # not publish.
  IS_RELEASE: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}

jobs:
  build:
    name: build ${{ matrix.target }}
    # Skipped in repair mode: a repair run only rebuilds and replaces an
    # existing release's ASSETS. Registry publishes would fail with 403 /
    # 409 (that version is already live) and turn a clean repair red.
    if: ${{ inputs.repair_tag == '' }}
    runs-on: ${{ matrix.host }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - host: windows-latest
            target: x86_64-pc-windows-msvc
          # Was macos-13: found stuck queued (no runner ever assigned) for 9+
          # hours on the v0.2.0 tag push while working on issue #125 — GitHub
          # has been winding down macos-13 hosted-runner capacity. macos-14 is
          # Apple Silicon but still cross-compiles x86_64-apple-darwin fine
          # (same cross-compile approach the aarch64-apple-ios/-sim jobs
          # already rely on in mobile-build.yml).
          - host: macos-14
            target: x86_64-apple-darwin
          - host: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # --ignore-scripts: skip the `install` script so npm does not kick off a
      # second (platform-default) Rust build before we build the real target.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build native addon (${{ matrix.target }})
        run: npx napi build --platform --release --target ${{ matrix.target }}

      - name: Upload addon artifact
        uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.target }}
          path: '*.node'
          if-no-files-found: error

  publish:
    name: publish to npm
    # Skipped in repair mode: a repair run only rebuilds and replaces an
    # existing release's ASSETS. Registry publishes would fail with 403 /
    # 409 (that version is already live) and turn a clean repair red.
    if: ${{ inputs.repair_tag == '' }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Download all addon artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Lay artifacts into per-platform npm dirs
        run: npx napi artifacts --dir artifacts

      - name: Show what will be published
        run: ls -R ./npm || true

      # Ungated, like maven-central-publish.yml's guard self-test and for the
      # same reason: this decides whether an irreversible publish is SKIPPED,
      # and its first version got that wrong (it accepted only HTTP 200, so
      # GitHub Packages' 302-for-an-existing-object read as "absent"). Logic
      # that only runs on the release path is logic nobody has run.
      - name: Self-test the already-published check
        run: bash scripts/registry-has-version.sh --self-test

      # prepublishOnly (napi prepublish -t npm) fires here: publishes the
      # per-platform packages and updates the main package optionalDependencies.
      #
      # The dist-tag is DERIVED from the version, not hard-coded. This was an
      # unconditional `--tag beta`, which silently froze `latest` at the first
      # version ever published: every later release landed on `beta`, so plain
      # `npm install <pkg>` kept serving the old one. Under semver a PRERELEASE
      # is a version carrying a `-` identifier (`0.1.0-beta.1`) — not merely any
      # pre-1.0 version. `0.2.4` is a normal release and belongs on `latest`.
      - name: Publish to npm
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          PKG=$(node -p "require('./package.json').name")
          case "$VERSION" in
            *-*) NPM_TAG=beta ;;
            *)   NPM_TAG=latest ;;
          esac
          echo "publishing $VERSION under dist-tag '$NPM_TAG'"

          # Runs in BOTH modes, so a dry run reports exactly what a release
          # would skip. A `v*` tag publishes every surface, but the surfaces
          # carry independent versions and rarely all change at once -
          # republishing an unchanged one returns 409 and turned the whole
          # release red, so a release shipping one fixed surface failed because
          # the others had nothing to do. The check fails toward publishing:
          # anything short of an unambiguous "already there" means publish.
          if bash "$GITHUB_WORKSPACE/scripts/registry-has-version.sh" npm "$PKG" "$VERSION"; then
            echo "$PKG@$VERSION is already on npm - nothing to publish"
            exit 0
          fi
          if [ "${IS_RELEASE:-}" != "true" ]; then
            # --dry-run still resolves the manifest, runs prepublishOnly and
            # lists the exact file set, so the packaging is really checked;
            # it just does not write to the registry.
            echo "DRY RUN: would publish $VERSION to dist-tag '$NPM_TAG'"
            npm publish --access public --tag "$NPM_TAG" --dry-run
            exit 0
          fi
          npm config set provenance true
          npm publish --access public --tag "$NPM_TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Issue #125: genesisdb-android → GitHub Packages. Self-contained (does not
  # depend on mobile-build.yml's android-build/android-aar jobs — release
  # workflows in this repo build their own artifacts fresh rather than
  # cross-workflow `needs:`, matching how the napi `build`/`publish` jobs
  # above already work independently of test.yml). Uses a release cargo-ndk
  # build (mobile-build.yml's android-build is deliberately debug, for CI
  # speed — a published artifact should be release).
  #
  # Three ABIs ship in the .aar: arm64-v8a and armeabi-v7a for physical
  # devices, and x86_64 for the emulator. x86_64 is not optional polish — the
  # default Android Studio AVD on a Windows or Linux host is x86_64, so an
  # .aar without that slice cannot be run in an emulator at all
  # (System.loadLibrary finds no matching slice). It costs roughly +7-10 MiB
  # uncompressed, which is only acceptable because these are stripped release
  # builds; see the DWARF/size guard below for the defect that made that true.
  android-publish:
    name: publish genesisdb-android to GitHub Packages
    runs-on: ubuntu-latest
    permissions:
      # contents: write — this job now attaches the .aar it builds as a
      # release asset (see "Attach .aar" below), instead of that asset being
      # uploaded by hand.
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          # In repair mode, build from the tag being repaired so the asset
          # matches the code it claims to be — not from whatever main is now.
          ref: ${{ inputs.repair_tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: mobile-android-publish

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
          add-to-path: true

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build SDK core for Android (arm64 + armv7 + x86_64, release)
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cargo ndk \
            --target aarch64-linux-android \
            --target armv7-linux-androideabi \
            --target x86_64-linux-android \
            build --release --no-default-features --features "mobile ffi android-jni"

      # Source paths are Rust target TRIPLES; destination directories are
      # Android ABI names. For x86_64 the two spellings differ
      # (x86_64-linux-android → x86_64) — jniLibs/ and build.gradle.kts's
      # abiFilters only ever take the ABI name.
      - name: Stage jniLibs
        run: |
          mkdir -p android/genesisdb/src/main/jniLibs/arm64-v8a android/genesisdb/src/main/jniLibs/armeabi-v7a android/genesisdb/src/main/jniLibs/x86_64
          cp target/aarch64-linux-android/release/libgenesis_block_native.so android/genesisdb/src/main/jniLibs/arm64-v8a/
          cp target/armv7-linux-androideabi/release/libgenesis_block_native.so android/genesisdb/src/main/jniLibs/armeabi-v7a/
          cp target/x86_64-linux-android/release/libgenesis_block_native.so android/genesisdb/src/main/jniLibs/x86_64/

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      # See android/genesisdb/build.gradle.kts's `publishing {}` block for the
      # coordinate + GitHub Packages repository config. GITHUB_TOKEN here is
      # the workflow's own auto-issued token — no repo secret needed.
      - name: gradle :genesisdb:publish
        # Skipped in repair mode: that version is already on GitHub Packages
        # and republishing an unchanged version returns 409 Conflict, which
        # would fail the job before it could replace the release asset.
        if: ${{ inputs.repair_tag == '' }}
        working-directory: android
        run: |
          set -euo pipefail
          VERSION=$(python3 -c "import json;d=json.load(open('../modules.json'));print(next(s['version'] for s in d['surfaces'] if s['name']=='genesisdb-android'))")
          echo "genesisdb-android version: $VERSION"

          # Same reason as the npm steps: a `v*` tag publishes every surface,
          # but genesisdb-android changes far less often than the packages that
          # wrap it, and republishing an unchanged version returns 409 - which
          # failed the whole release. Checked in BOTH modes so a dry run says
          # what a release would skip. The group here is the DEFAULT
          # dev.genesisblock coordinate this job publishes, not the
          # io.github.freshair129 one used for Maven Central.
          if bash "$GITHUB_WORKSPACE/scripts/registry-has-version.sh"                ghp-maven "${{ github.repository }}" dev/genesisblock genesisdb-android "$VERSION"; then
            echo "dev.genesisblock:genesisdb-android:$VERSION is already on GitHub Packages - nothing to publish"
            exit 0
          fi

          if [ "${IS_RELEASE:-}" != "true" ]; then
            # publishToMavenLocal exercises the whole publishing configuration
            # - POM generation, coordinates, artifact wiring - against a local
            # repository instead of GitHub Packages. Same code path, no remote
            # write, and no 409 on a version that already exists.
            echo "DRY RUN: publishing to the local Maven repository instead"
            gradle :genesisdb:publishToMavenLocal
            exit 0
          fi
          gradle :genesisdb:publish
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: gradle :genesisdb:assembleRelease
        working-directory: android
        run: gradle :genesisdb:assembleRelease

      # Guard against the exact defect this step exists to fix: the v0.2.0
      # release asset was a DEBUG .aar uploaded by hand from mobile-build.yml's
      # artifact (that workflow builds without --release on purpose, for CI
      # speed). It shipped 281 MB of native libs where only ~12 MB was .text —
      # 78% DWARF, 10% symbol tables. `[profile.release]` sets
      # `strip = "symbols"`, so a correct release .so carries NO .debug_*
      # sections at all. Assert that, and a size ceiling, so a debug build can
      # never be published as a release asset again.
      #
      # The loop globs jniLibs/*/ so it covers every ABI staged above,
      # x86_64 included, with no per-ABI list to keep in sync. The 40 MiB
      # ceiling is PER SLICE, not for the .aar as a whole, so adding a third
      # ABI does not push anything toward it: a stripped release x86_64 slice
      # lands in the same ~7-10 MiB band as arm64-v8a (7 MiB) and
      # armeabi-v7a (5 MiB), leaving the ceiling at roughly 4x headroom —
      # loose enough not to flake on normal growth, tight enough that the
      # 126-141 MiB debug slices that caused the original defect still trip it
      # instantly.
      - name: Verify .so slices are release-built (no DWARF)
        run: |
          set -euo pipefail
          fail=0
          for so in android/genesisdb/src/main/jniLibs/*/libgenesis_block_native.so; do
            size=$(stat -c%s "$so")
            mib=$(( size / 1048576 ))
            if readelf -S "$so" | grep -q '\.debug_'; then
              echo "::error::$so contains .debug_* sections — this is a DEBUG build, not a release build."
              fail=1
            fi
            if [ "$mib" -gt 40 ]; then
              echo "::error::$so is ${mib} MiB — far above the ~10 MiB expected for a stripped release build."
              fail=1
            fi
            echo "$so: ${mib} MiB"
          done
          exit $fail

      # Attaching the asset here — from the job that actually builds with
      # --release — is the root-cause fix. Previously nothing attached it, so
      # it was uploaded by hand and the wrong (debug) artifact got picked.
      - name: Attach .aar to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.repair_tag || github.ref_name }}"
          # Read the surface version from modules.json, NOT from
          # build.gradle.kts. Repair mode checks out an OLD tag's source, which
          # can predate the packaging machinery doing the repair: at v0.2.0
          # `android/genesisdb/build.gradle.kts` has neither the
          # `genesisdbAndroidVersion` val nor a `publishing {}` block at all —
          # both arrived later with the issue-#125 publish work — so the
          # gradle-file lookup failed there and killed the first repair run.
          # modules.json has carried `genesisdb-android`'s version since well
          # before that tag and is the declared SSOT for surface versions, so
          # it is the stable source across the whole tag range.
          VERSION=$(python3 -c "import json;d=json.load(open('modules.json'));print(next(s['version'] for s in d['surfaces'] if s['name']=='genesisdb-android'))" 2>/dev/null || true)
          if [ -z "$VERSION" ]; then
            # Fallback for any future tree that drops the modules.json entry.
            VERSION=$(sed -n 's/.*val genesisdbAndroidVersion = "\([^"]*\)".*/\1/p' android/genesisdb/build.gradle.kts)
          fi
          if [ -z "$VERSION" ]; then
            echo "::error::could not determine the genesisdb-android version from modules.json or android/genesisdb/build.gradle.kts"
            exit 1
          fi
          echo "genesisdb-android version: $VERSION"
          SRC=$(ls android/genesisdb/build/outputs/aar/*.aar | head -1)
          ASSET="genesisdb-android-${VERSION}.aar"
          cp "$SRC" "$ASSET"
          ls -la "$ASSET"

          # Pushing a tag creates a TAG, not a GitHub Release — and
          # `gh release upload` fails with "release not found" against a tag
          # that has no Release. This bit on the very first normal-mode run
          # (v0.2.4): every publish succeeded and only the attach step went
          # red. Repair mode never hit it because it targets a tag whose
          # Release already exists by definition.
          #
          # Create the Release if it is missing, then upload. `--verify-tag`
          # refuses to invent a Release for a tag that does not exist, so a
          # typo'd repair_tag still fails loudly instead of silently creating
          # a bogus Release.
          # Everything above this line runs in a dry run: the version lookup
          # from modules.json, the asset naming, the copy, the size listing.
          # That is deliberate - the defect this step shipped with in #139 was
          # in the version lookup, and a dry run would have caught it.
          #
          # Honest limit: the release-not-found defect of #144 lived in the
          # upload itself, and no dry run can exercise a write. This narrows
          # the unexercised surface to the two gh calls below; it does not
          # eliminate it.
          if [ "${IS_RELEASE:-}" != "true" ]; then
            echo "DRY RUN: would attach $ASSET to the GitHub Release for $TAG"
            exit 0
          fi

          if ! gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "no GitHub Release for $TAG yet — creating one"
            gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --title "$TAG" \
              --verify-tag \
              --generate-notes
          fi

          gh release upload "$TAG" "$ASSET" --clobber --repo "${{ github.repository }}"

  # Issue #125: react-native-genesisdb → npm. Independent package (its own
  # package-lock.json, not an npm workspace member of the repo root — see
  # react-native-genesisdb/package.json), so it gets its own install/build/
  # publish steps rather than reusing the root `npm ci` above.
  rn-npm-publish:
    name: publish react-native-genesisdb to npm
    # Skipped in repair mode: a repair run only rebuilds and replaces an
    # existing release's ASSETS. Registry publishes would fail with 403 /
    # 409 (that version is already live) and turn a clean repair red.
    if: ${{ inputs.repair_tag == '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    defaults:
      run:
        working-directory: react-native-genesisdb
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      # Same version-derived dist-tag as the main package above. The comment
      # here used to read "keeps this pre-1.0 package off `latest`", conflating
      # pre-1.0 with prerelease — a reading that pins `latest` to 0.1.0 until
      # some 1.0.0 exists. It did exactly that: 0.1.1 carried the Android AND
      # iOS integration fixes while plain `npm install react-native-genesisdb`
      # still served the 0.1.0 that was broken on both platforms.
      - name: Publish to npm
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          PKG=$(node -p "require('./package.json').name")
          case "$VERSION" in
            *-*) NPM_TAG=beta ;;
            *)   NPM_TAG=latest ;;
          esac
          echo "publishing $VERSION under dist-tag '$NPM_TAG'"

          # Runs in BOTH modes, so a dry run reports exactly what a release
          # would skip. A `v*` tag publishes every surface, but the surfaces
          # carry independent versions and rarely all change at once -
          # republishing an unchanged one returns 409 and turned the whole
          # release red, so a release shipping one fixed surface failed because
          # the others had nothing to do. The check fails toward publishing:
          # anything short of an unambiguous "already there" means publish.
          if bash "$GITHUB_WORKSPACE/scripts/registry-has-version.sh" npm "$PKG" "$VERSION"; then
            echo "$PKG@$VERSION is already on npm - nothing to publish"
            exit 0
          fi
          if [ "${IS_RELEASE:-}" != "true" ]; then
            # --dry-run still resolves the manifest, runs prepublishOnly and
            # lists the exact file set, so the packaging is really checked;
            # it just does not write to the registry.
            echo "DRY RUN: would publish $VERSION to dist-tag '$NPM_TAG'"
            npm publish --access public --tag "$NPM_TAG" --dry-run
            exit 0
          fi
          npm config set provenance true
          npm publish --access public --tag "$NPM_TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
