# Mobile cross-compile gate (MARK XVI Phase 0-B "Cross-compile probe").
#
# Proves the storage core links for iOS and Android targets and that the
# `mobile` feature build + test stays green on Linux CI. The dev box is Windows
# with no Mac and no Android NDK, so these jobs CANNOT be validated locally —
# they exist precisely so GitHub's macOS/Linux runners do the cross-compile.
#
# Build model (see CLAUDE.md + docs/SPEC--MOBILE-SDK.md):
#   `cargo build --no-default-features --features mobile` drops the napi
#   bindings (no napi_* symbols), the `bins` feature, and `sysinfo` (its RSS
#   probe uses OS APIs that fail in mobile sandboxes). That decoupled core is
#   what links on iOS/Android and on plain Linux.
#
# Phase B (SDK) builds the SDK surface on top of that core:
#   iOS     — `--features "mobile ffi"`  → staticlib + C ABI (src/ffi.rs) for
#             the GenesisBlockDB.xcframework. The C header is include/genesisdb.h.
#   Android — `--features "mobile ffi android-jni"` → cdylib `.so` exporting the
#             JNI bridge (src/jni.rs) the .aar's Kotlin wrapper binds.
# The `android-jni` build also type-checks on the host (the `jni` crate is pure
# Rust), so host-mobile-check exercises it without a device.
#
# B-1 (ios/genesisdb, the Swift wrapper) has two more gates:
#   ios-xcframework   — assembles the real GenesisBlockDB.xcframework on top
#                       of ios-build's staticlib output (mirrors android-aar).
#   ios-swift-tests   — GenesisDBTypesTests (pure Codable wire-format tests,
#                       no native lib, mirrors android-jvm-tests) plus
#                       GenesisDBTests, a REAL addNode/retrieveContext/search
#                       round trip against a host-arch build of the engine.
#
# B-2 (android/genesisdb, the Kotlin wrapper + .aar) has two more gates:
#   android-jvm-tests — pure-JVM kotlinx.serialization tests for the wire
#                       contract (android/README.md "Wire format gotcha").
#                       Needs no native .so and no NDK.
#   android-aar       — assembles the actual .aar on top of android-build's
#                       .so slices, proving the Gradle module links against
#                       real cargo-ndk output end to end.
#
# Targets (from SPEC §0-B):
#   aarch64-apple-ios          — iOS device
#   aarch64-apple-ios-sim      — iOS Simulator (Apple Silicon)
#   aarch64-linux-android      — Android arm64
#   armv7-linux-androideabi    — Android 32-bit ABI

name: Mobile Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'include/**'
      - 'cbindgen.toml'
      - 'scripts/gen-header.sh'
      - 'scripts/gen-android-jnilibs.sh'
      - 'android/**'
      - 'ios/**'
      - 'react-native-genesisdb/**'
      - 'Cargo.toml'
      - '.github/workflows/mobile-build.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'include/**'
      - 'cbindgen.toml'
      - 'scripts/gen-header.sh'
      - 'scripts/gen-android-jnilibs.sh'
      - 'android/**'
      - 'ios/**'
      - 'react-native-genesisdb/**'
      - 'Cargo.toml'
      - '.github/workflows/mobile-build.yml'

permissions:
  contents: read

jobs:
  # iOS device + simulator. macOS runner is the ONLY way to validate iOS —
  # the dev machine is Windows with no Mac.
  ios-build:
    name: iOS cross-compile (device + sim)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim

      - uses: Swatinem/rust-cache@v2
        with:
          key: mobile-ios

      # Belt-and-suspenders: the toolchain action already installs the targets
      # above, but the SPEC documents `rustup target add` explicitly.
      - name: Ensure iOS targets installed
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim

      # `mobile ffi` → the staticlib + C ABI the xcframework is assembled from.
      - name: Build SDK core for aarch64-apple-ios (device)
        run: cargo build --no-default-features --features "mobile ffi" --target aarch64-apple-ios

      - name: Build SDK core for aarch64-apple-ios-sim (simulator)
        run: cargo build --no-default-features --features "mobile ffi" --target aarch64-apple-ios-sim

      # The xcframework links libgenesis_block_native.a — confirm the staticlib
      # slice is actually produced for the device target.
      - name: Verify iOS staticlib (.a) was produced
        run: test -f target/aarch64-apple-ios/debug/libgenesis_block_native.a

      # Stage both slices for ios-xcframework so it doesn't repeat this build.
      - name: Stage staticlibs for ios-xcframework
        run: |
          mkdir -p ios-libs/aarch64-apple-ios ios-libs/aarch64-apple-ios-sim
          cp target/aarch64-apple-ios/debug/libgenesis_block_native.a ios-libs/aarch64-apple-ios/
          cp target/aarch64-apple-ios-sim/debug/libgenesis_block_native.a ios-libs/aarch64-apple-ios-sim/

      - uses: actions/upload-artifact@v4
        with:
          name: ios-staticlibs
          path: ios-libs/
          retention-days: 7

  # B-1: assemble the real xcframework on top of ios-build's staticlib
  # output — proves the two slices actually combine into a working xcframework,
  # not just that they individually compile. Mirrors android-aar's role for B-2.
  ios-xcframework:
    name: iOS xcframework assembly
    needs: ios-build
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ios-staticlibs
          path: ios-libs

      - name: Assemble GenesisBlockDB.xcframework
        run: >
          xcodebuild -create-xcframework
          -library ios-libs/aarch64-apple-ios/libgenesis_block_native.a
          -headers include/
          -library ios-libs/aarch64-apple-ios-sim/libgenesis_block_native.a
          -headers include/
          -output GenesisBlockDB.xcframework

      - uses: actions/upload-artifact@v4
        with:
          name: GenesisBlockDB-xcframework
          path: GenesisBlockDB.xcframework
          retention-days: 14

  # B-1: the Swift SDK (ios/genesisdb). Two independent properties, like
  # android-jvm-tests proves for Types.kt:
  #   - GenesisDBTypesTests needs no native lib at all (pure Codable wire
  #     types) — always runs.
  #   - GenesisDBTests links a HOST-arch build of libgenesis_block_native.a
  #     (deliberately not the cross-compiled iOS slices, which cannot execute
  #     on the build machine) and runs a REAL addNode/retrieveContext/search
  #     round trip against the compiled engine — see ios/README.md "Building".
  ios-swift-tests:
    name: iOS Swift SDK tests
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: mobile-ios-swift-tests

      # No --target: build for the runner's own host triple so the resulting
      # .a can actually link into (and run inside) the Swift test binary.
      - name: Build SDK core for host
        run: cargo build --no-default-features --features "mobile ffi"

      - name: Copy C header for CGenesisDBFFI (see module.modulemap)
        run: |
          mkdir -p ios/genesisdb/Sources/CGenesisDBFFI/include
          cp include/genesisdb.h ios/genesisdb/Sources/CGenesisDBFFI/include/genesisdb.h

      - name: swift test
        working-directory: ios/genesisdb
        env:
          GENESISDB_RUST_LIB_DIR: ${{ github.workspace }}/target/debug
        run: swift test

  # Android arm64 + armv7 via cargo-ndk. nttld/setup-ndk provisions the NDK;
  # cargo-ndk wires the right clang linker per target so no manual
  # --config target.<triple>.linker is needed (cf. SPEC §0-B note).
  android-build:
    name: Android cross-compile (arm64 + armv7)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi

      - uses: Swatinem/rust-cache@v2
        with:
          key: mobile-android

      - name: Ensure Android targets installed
        run: rustup target add aarch64-linux-android armv7-linux-androideabi

      # Pinned to an LTS NDK. cargo-ndk expects ANDROID_NDK_HOME / ANDROID_NDK_ROOT,
      # which this action exports.
      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
          add-to-path: true

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      # cargo-ndk selects the NDK clang linker for each --target; `build` then
      # invokes cargo build with the mobile feature for both ABIs.
      # `mobile ffi android-jni` → the cdylib `.so` exporting the JNI bridge
      # (src/jni.rs) that the .aar's Kotlin wrapper binds via System.loadLibrary.
      - name: Build SDK core for Android (arm64 + armv7)
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cargo ndk \
            --target aarch64-linux-android \
            --target armv7-linux-androideabi \
            build --no-default-features --features "mobile ffi android-jni"

      # System.loadLibrary("genesis_block_native") needs the .so — confirm the
      # cdylib slice exists for arm64.
      - name: Verify Android shared lib (.so) was produced
        run: test -f target/aarch64-linux-android/debug/libgenesis_block_native.so

      # Stage both ABI slices for the android-aar job (same layout
      # scripts/gen-android-jnilibs.sh produces for local dev).
      - name: Stage jniLibs for android-aar
        run: |
          mkdir -p jnilibs-out/arm64-v8a jnilibs-out/armeabi-v7a
          cp target/aarch64-linux-android/debug/libgenesis_block_native.so jnilibs-out/arm64-v8a/
          cp target/armv7-linux-androideabi/debug/libgenesis_block_native.so jnilibs-out/armeabi-v7a/

      - uses: actions/upload-artifact@v4
        with:
          name: android-jnilibs
          path: jnilibs-out/
          retention-days: 7

  # B-2: pure-JVM kotlinx.serialization tests for android/genesisdb's wire
  # contract (Types.kt @SerialName vs the engine's un-renamed serde JSON).
  # No native .so, no NDK — these run on any JDK.
  android-jvm-tests:
    name: Android SDK JVM tests (wire contract)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: gradle :genesisdb:testDebugUnitTest
        working-directory: android
        run: gradle :genesisdb:testDebugUnitTest

  # B-2: assemble the real .aar on top of android-build's cargo-ndk output —
  # proves the Gradle module actually links a genuine .so, not just that it
  # type-checks. See android/README.md "Building".
  android-aar:
    name: Assemble genesisdb .aar
    needs: android-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: android-jnilibs
          path: android/genesisdb/src/main/jniLibs

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: gradle :genesisdb:assembleRelease
        working-directory: android
        run: gradle :genesisdb:assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: genesisdb-android-aar
          path: android/genesisdb/build/outputs/aar/*.aar
          retention-days: 14

  # B-3: react-native-genesisdb's TS pass-through layer. Pure Node/Jest against
  # a stubbed `react-native` module (src/__mocks__/react-native.ts) — no RN
  # runtime, no Android/iOS build. The android/ and ios/ native module sources
  # under react-native-genesisdb are validated by building them inside a real
  # RN host app, which is out of scope for this monorepo's CI (same host-only
  # carve-out as B-1/B-2's device paths).
  rn-genesisdb-tests:
    name: react-native-genesisdb TS tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: react-native-genesisdb
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install --no-audit --no-fund

      - run: npx tsc -p tsconfig.json --noEmit

      - run: npx jest

  # P2 "cargo test --features mobile green": the core/napi split is designed to
  # link on Linux, so the mobile-feature build AND the integration test suite
  # run here on the host triple (no cross-compile, real test execution).
  host-mobile-check:
    name: host build + test (mobile SDK features)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: mobile-host

      # Full SDK feature set on the host: `android-jni` pulls the pure-Rust `jni`
      # crate, which compiles off-device, so the JNI bridge (src/jni.rs) and the
      # C ABI (src/ffi.rs) both type-check and the integration tests run for real.
      - name: cargo build (mobile SDK features, host triple)
        run: cargo build --no-default-features --features "mobile ffi android-jni"

      - name: cargo test (mobile SDK features, host triple)
        run: cargo test --no-default-features --features "mobile ffi android-jni"

  # The C header (include/genesisdb.h) is the iOS/Swift contract and is generated
  # from src/ffi.rs by cbindgen. It is committed so consumers and the xcframework
  # build don't need cbindgen — this gate fails if it drifts from src/ffi.rs.
  c-header-freshness:
    name: C header freshness (cbindgen)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: mobile-cbindgen

      - name: Install cbindgen
        run: cargo install cbindgen --locked

      - name: Regenerate header from src/ffi.rs
        run: bash scripts/gen-header.sh

      - name: Fail if committed header is stale
        run: |
          if ! git diff --exit-code include/genesisdb.h; then
            echo "::error::include/genesisdb.h is out of date with src/ffi.rs. Run scripts/gen-header.sh and commit the result." >&2
            exit 1
          fi
