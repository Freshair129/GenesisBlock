# Mobile cross-compile gate (MARK XVI Phase 0-B "Cross-compile probe").
#
# Proves the storage core links for iOS and Android targets and that the
# `mobile` feature build + test stays green on Linux CI. The dev box is Windows
# with no Mac and no Android NDK, so these jobs CANNOT be validated locally —
# they exist precisely so GitHub's macOS/Linux runners do the cross-compile.
#
# Build model (see CLAUDE.md + docs/SPEC--MOBILE-SDK.md):
#   `cargo build --no-default-features --features mobile` drops the napi
#   bindings (no napi_* symbols), the `bins` feature, and `sysinfo` (its RSS
#   probe uses OS APIs that fail in mobile sandboxes). That decoupled core is
#   what links on iOS/Android and on plain Linux.
#
# Phase B (SDK) builds the SDK surface on top of that core:
#   iOS     — `--features "mobile ffi"`  → staticlib + C ABI (src/ffi.rs) for
#             the GenesisBlockDB.xcframework. The C header is include/genesisdb.h.
#   Android — `--features "mobile ffi android-jni"` → cdylib `.so` exporting the
#             JNI bridge (src/jni.rs) the .aar's Kotlin wrapper binds.
# The `android-jni` build also type-checks on the host (the `jni` crate is pure
# Rust), so host-mobile-check exercises it without a device.
#
# B-1 (ios/genesisdb, the Swift wrapper) has two more gates:
#   ios-xcframework   — assembles the real GenesisBlockDB.xcframework on top
#                       of ios-build's staticlib output (mirrors android-aar),
#                       then zips it with BSD zip (Unix "made by" attribute) —
#                       the only way to produce a .xcframework.zip that
#                       SwiftPM's binaryTarget extraction accepts; see that
#                       step's comment for the Windows-zip bug this replaces.
#   ios-swift-tests   — GenesisDBTypesTests (pure Codable wire-format tests,
#                       no native lib, mirrors android-jvm-tests) plus
#                       GenesisDBTests, a REAL addNode/retrieveContext/search
#                       round trip against a host-arch build of the engine.
#
# B-2 (android/genesisdb, the Kotlin wrapper + .aar) has two more gates:
#   android-jvm-tests — pure-JVM kotlinx.serialization tests for the wire
#                       contract (android/README.md "Wire format gotcha").
#                       Needs no native .so and no NDK.
#   android-aar       — assembles the actual .aar on top of android-build's
#                       .so slices, proving the Gradle module links against
#                       real cargo-ndk output end to end.
#
# On-device acceptance (issue #125 follow-up, MARK XVI Phase B DoD):
#   ios-acceptance-test — mobile-acceptance/ios/ is a genuinely independent
#                         "blank consumer" SPM package (NOT ios/genesisdb)
#                         that depends ONLY on the *published* v0.2.0
#                         GenesisBlockDB.xcframework release asset via
#                         `.binaryTarget(url:, checksum:)` — proving the real
#                         external-consumer distribution path, executed for
#                         real inside the iOS Simulator via `xcodebuild test`.
#
# Targets (from SPEC §0-B):
#   aarch64-apple-ios          — iOS device
#   aarch64-apple-ios-sim      — iOS Simulator (Apple Silicon)
#   aarch64-linux-android      — Android arm64 (every modern physical device)
#   armv7-linux-androideabi    — Android 32-bit ABI (older physical devices)
#   x86_64-linux-android       — Android x86_64. NOT a phone ABI: it is what the
#                                standard Android Studio AVD runs as on a
#                                Windows or Linux dev machine, and the only
#                                Android ABI GitHub's x86_64 runners can
#                                emulate. Without this slice
#                                System.loadLibrary finds no match and a
#                                consumer cannot run their app in an emulator
#                                at all.

name: Mobile Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'include/**'
      - 'cbindgen.toml'
      - 'scripts/gen-header.sh'
      - 'scripts/gen-android-jnilibs.sh'
      - 'android/**'
      - 'ios/**'
      - 'react-native-genesisdb/**'
      - 'mobile-acceptance/**'
      - 'Cargo.toml'
      - '.github/workflows/mobile-build.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'include/**'
      - 'cbindgen.toml'
      - 'scripts/gen-header.sh'
      - 'scripts/gen-android-jnilibs.sh'
      - 'android/**'
      - 'ios/**'
      - 'react-native-genesisdb/**'
      - 'mobile-acceptance/**'
      - 'Cargo.toml'
      - '.github/workflows/mobile-build.yml'

permissions:
  contents: read

jobs:
  # iOS device + simulator. macOS runner is the ONLY way to validate iOS —
  # the dev machine is Windows with no Mac.
  ios-build:
    name: iOS cross-compile (device + sim)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim

      - uses: Swatinem/rust-cache@v2
        with:
          key: mobile-ios

      # Belt-and-suspenders: the toolchain action already installs the targets
      # above, but the SPEC documents `rustup target add` explicitly.
      - name: Ensure iOS targets installed
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim

      # `mobile ffi` → the staticlib + C ABI the xcframework is assembled from.
      - name: Build SDK core for aarch64-apple-ios (device)
        run: cargo build --no-default-features --features "mobile ffi" --target aarch64-apple-ios

      - name: Build SDK core for aarch64-apple-ios-sim (simulator)
        run: cargo build --no-default-features --features "mobile ffi" --target aarch64-apple-ios-sim

      # The xcframework links libgenesis_block_native.a — confirm the staticlib
      # slice is actually produced for the device target.
      - name: Verify iOS staticlib (.a) was produced
        run: test -f target/aarch64-apple-ios/debug/libgenesis_block_native.a

      # Stage both slices for ios-xcframework so it doesn't repeat this build.
      - name: Stage staticlibs for ios-xcframework
        run: |
          mkdir -p ios-libs/aarch64-apple-ios ios-libs/aarch64-apple-ios-sim
          cp target/aarch64-apple-ios/debug/libgenesis_block_native.a ios-libs/aarch64-apple-ios/
          cp target/aarch64-apple-ios-sim/debug/libgenesis_block_native.a ios-libs/aarch64-apple-ios-sim/

      - uses: actions/upload-artifact@v4
        with:
          name: ios-staticlibs
          path: ios-libs/
          retention-days: 7

  # B-1: assemble the real xcframework on top of ios-build's staticlib
  # output — proves the two slices actually combine into a working xcframework,
  # not just that they individually compile. Mirrors android-aar's role for B-2.
  ios-xcframework:
    name: iOS xcframework assembly
    needs: ios-build
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ios-staticlibs
          path: ios-libs

      - name: Assemble GenesisBlockDB.xcframework
        run: >
          xcodebuild -create-xcframework
          -library ios-libs/aarch64-apple-ios/libgenesis_block_native.a
          -headers include/
          -library ios-libs/aarch64-apple-ios-sim/libgenesis_block_native.a
          -headers include/
          -output GenesisBlockDB.xcframework

      - uses: actions/upload-artifact@v4
        with:
          name: GenesisBlockDB-xcframework
          path: GenesisBlockDB.xcframework
          retention-days: 14

      # The actual v0.2.0 release asset (GenesisBlockDB.xcframework.zip,
      # consumed by react-native-genesisdb.podspec's prepare_command and by
      # mobile-acceptance/ios/Package.swift's .binaryTarget) was zipped by
      # hand on the Windows dev box (release.yml deliberately ships it as a
      # manual step, not a package-manager publish — see that workflow's
      # header comment) — found+fixed by the ios-acceptance-test job's first
      # real run: Windows zip tools (PowerShell Compress-Archive, .NET
      # ZipFile, ...) write the zip "version made by" host byte as 0
      # (MS-DOS/FAT) instead of 3 (Unix), and macOS's Info-ZIP-based unzip
      # (what SwiftPM's binaryTarget extraction shells out to) treats a
      # non-Unix host byte as a signal to distrust the archive's path
      # separators — it aborts with "appears to use backslashes as path
      # separators" even though every entry inside is already forward-slash
      # (verified: the actual entry names have zero backslashes; it's the
      # host-attribute byte alone that trips the check). BSD zip (this step,
      # running on a real macOS runner) writes host=3, which extracts cleanly.
      # This step exists so future xcframework re-publishes never repeat the
      # manual-Windows-zip mistake — always zip (and, when replacing the
      # release asset, always re-upload) from here, not by hand.
      - name: Zip xcframework with a Unix-attributed zip (portable for SwiftPM binaryTarget)
        run: zip -r -X --symlinks GenesisBlockDB.xcframework.zip GenesisBlockDB.xcframework

      - uses: actions/upload-artifact@v4
        with:
          name: GenesisBlockDB-xcframework-zip
          path: GenesisBlockDB.xcframework.zip
          retention-days: 14

  # B-1: the Swift SDK (ios/genesisdb). Two independent properties, like
  # android-jvm-tests proves for Types.kt:
  #   - GenesisDBTypesTests needs no native lib at all (pure Codable wire
  #     types) — always runs.
  #   - GenesisDBTests links a HOST-arch build of libgenesis_block_native.a
  #     (deliberately not the cross-compiled iOS slices, which cannot execute
  #     on the build machine) and runs a REAL addNode/retrieveContext/search
  #     round trip against the compiled engine — see ios/README.md "Building".
  ios-swift-tests:
    name: iOS Swift SDK tests
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: mobile-ios-swift-tests

      # No --target: build for the runner's own host triple so the resulting
      # .a can actually link into (and run inside) the Swift test binary.
      - name: Build SDK core for host
        run: cargo build --no-default-features --features "mobile ffi"

      - name: Copy C header for CGenesisDBFFI (see module.modulemap)
        run: |
          mkdir -p ios/genesisdb/Sources/CGenesisDBFFI/include
          cp include/genesisdb.h ios/genesisdb/Sources/CGenesisDBFFI/include/genesisdb.h

      - name: swift test
        working-directory: ios/genesisdb
        env:
          GENESISDB_RUST_LIB_DIR: ${{ github.workspace }}/target/debug
        run: swift test

  # MARK XVI on-device acceptance (issue #125 follow-up). Independent of
  # ios-swift-tests above: that job proves the local host-arch build works;
  # this one proves the *published* GenesisBlockDB.xcframework release asset
  # is consumable by a genuinely blank SPM package (mobile-acceptance/ios/,
  # not ios/genesisdb) via `.binaryTarget(url:, checksum:)` — the actual
  # distribution mechanism a real external consumer uses — and that the
  # linked C ABI genuinely executes inside the iOS Simulator, not just
  # compiles. No local Rust build needed here; the whole point is testing
  # what's already live on the release.
  ios-acceptance-test:
    name: iOS acceptance test (published xcframework via SPM)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Pick the first available iPhone simulator dynamically rather than
      # hardcoding a model name — the exact default device list shifts with
      # every Xcode version GitHub bumps the macos-latest image to.
      - name: Find an available iPhone simulator
        id: sim
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print(next(dev['udid'] for runtime in d['devices'].values() for dev in runtime if dev['name'].startswith('iPhone')))")
          echo "device_id=$DEVICE_ID" >> "$GITHUB_OUTPUT"

      # Diagnostic: Package.swift declares no `products:` (only a binaryTarget
      # + a testTarget), so xcodebuild's implicit-workspace scheme generation
      # doesn't produce a scheme matching the package name — it auto-vends
      # one whole-package scheme named "<PackageName>-Package" instead
      # (confirmed via this step's own output: neither `-scheme
      # GenesisAcceptance` nor `-scheme GenesisAcceptanceTests` exist; only
      # `GenesisAcceptance-Package` does). Keeping `-list` here means the
      # next naming drift (e.g. a future Xcode version changing this
      # convention) shows up in the log instead of as a bare "no such scheme"
      # failure.
      - name: List available schemes (diagnostic)
        working-directory: mobile-acceptance/ios
        run: xcodebuild -list

      - name: xcodebuild test (iOS Simulator)
        working-directory: mobile-acceptance/ios
        run: |
          xcodebuild test \
            -scheme GenesisAcceptance-Package \
            -destination "id=${{ steps.sim.outputs.device_id }}"

  # Android arm64 + armv7 + x86_64 via cargo-ndk. nttld/setup-ndk provisions
  # the NDK; cargo-ndk wires the right clang linker per target so no manual
  # --config target.<triple>.linker is needed (cf. SPEC §0-B note).
  #
  # x86_64 exists for the emulator, not for devices: the default Android
  # Studio AVD on a Windows/Linux host is x86_64, so building only the two ARM
  # ABIs left every consumer on those hosts unable to run the SDK anywhere but
  # on real hardware. It is also the prerequisite for any future
  # emulator-based acceptance job on GitHub's x86_64 runners.
  android-build:
    name: Android cross-compile (arm64 + armv7 + x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: mobile-android

      - name: Ensure Android targets installed
        run: rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android

      # Pinned to an LTS NDK. cargo-ndk expects ANDROID_NDK_HOME / ANDROID_NDK_ROOT,
      # which this action exports.
      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
          add-to-path: true

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      # cargo-ndk selects the NDK clang linker for each --target; `build` then
      # invokes cargo build with the mobile feature for all three ABIs.
      # `mobile ffi android-jni` → the cdylib `.so` exporting the JNI bridge
      # (src/jni.rs) that the .aar's Kotlin wrapper binds via System.loadLibrary.
      - name: Build SDK core for Android (arm64 + armv7 + x86_64)
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cargo ndk \
            --target aarch64-linux-android \
            --target armv7-linux-androideabi \
            --target x86_64-linux-android \
            build --no-default-features --features "mobile ffi android-jni"

      # System.loadLibrary("genesis_block_native") needs the .so — confirm the
      # cdylib slice exists for arm64 (the device ABI) and for x86_64 (the
      # emulator ABI), so a mistyped or dropped target fails here with a clear
      # message rather than further down in the staging copy.
      - name: Verify Android shared libs (.so) were produced
        run: |
          test -f target/aarch64-linux-android/debug/libgenesis_block_native.so
          test -f target/x86_64-linux-android/debug/libgenesis_block_native.so

      # Stage all three ABI slices for the android-aar job (same layout
      # scripts/gen-android-jnilibs.sh produces for local dev). Note the two
      # spellings: the source paths are Rust target TRIPLES, the destination
      # directories are Android ABI names, and for x86_64 they differ
      # (x86_64-linux-android → x86_64). jniLibs/ and abiFilters only ever
      # take the ABI name.
      - name: Stage jniLibs for android-aar
        run: |
          mkdir -p jnilibs-out/arm64-v8a jnilibs-out/armeabi-v7a jnilibs-out/x86_64
          cp target/aarch64-linux-android/debug/libgenesis_block_native.so jnilibs-out/arm64-v8a/
          cp target/armv7-linux-androideabi/debug/libgenesis_block_native.so jnilibs-out/armeabi-v7a/
          cp target/x86_64-linux-android/debug/libgenesis_block_native.so jnilibs-out/x86_64/

      - uses: actions/upload-artifact@v4
        with:
          name: android-jnilibs
          path: jnilibs-out/
          retention-days: 7

  # B-2: pure-JVM kotlinx.serialization tests for android/genesisdb's wire
  # contract (Types.kt @SerialName vs the engine's un-renamed serde JSON).
  # No native .so, no NDK — these run on any JDK.
  android-jvm-tests:
    name: Android SDK JVM tests (wire contract)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: gradle :genesisdb:testDebugUnitTest
        working-directory: android
        run: gradle :genesisdb:testDebugUnitTest

  # B-2: assemble the real .aar on top of android-build's cargo-ndk output —
  # proves the Gradle module actually links a genuine .so, not just that it
  # type-checks. See android/README.md "Building".
  android-aar:
    name: Assemble genesisdb .aar
    needs: android-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: android-jnilibs
          path: android/genesisdb/src/main/jniLibs

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: gradle :genesisdb:assembleRelease
        working-directory: android
        run: gradle :genesisdb:assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: genesisdb-android-aar
          path: android/genesisdb/build/outputs/aar/*.aar
          retention-days: 14

  # B-3: react-native-genesisdb's TS pass-through layer. Pure Node/Jest against
  # a stubbed `react-native` module (src/__mocks__/react-native.ts) — no RN
  # runtime, no Android/iOS build. The android/ and ios/ native module sources
  # under react-native-genesisdb are validated by building them inside a real
  # RN host app, which is out of scope for this monorepo's CI (same host-only
  # carve-out as B-1/B-2's device paths).
  rn-genesisdb-tests:
    name: react-native-genesisdb TS tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: react-native-genesisdb
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install --no-audit --no-fund

      - run: npx tsc -p tsconfig.json --noEmit

      - run: npx jest

  # P2 "cargo test --features mobile green": the core/napi split is designed to
  # link on Linux, so the mobile-feature build AND the integration test suite
  # run here on the host triple (no cross-compile, real test execution).
  host-mobile-check:
    name: host build + test (mobile SDK features)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: mobile-host

      # Full SDK feature set on the host: `android-jni` pulls the pure-Rust `jni`
      # crate, which compiles off-device, so the JNI bridge (src/jni.rs) and the
      # C ABI (src/ffi.rs) both type-check and the integration tests run for real.
      - name: cargo build (mobile SDK features, host triple)
        run: cargo build --no-default-features --features "mobile ffi android-jni"

      - name: cargo test (mobile SDK features, host triple)
        run: cargo test --no-default-features --features "mobile ffi android-jni"

  # The C header (include/genesisdb.h) is the iOS/Swift contract and is generated
  # from src/ffi.rs by cbindgen. It is committed so consumers and the xcframework
  # build don't need cbindgen — this gate fails if it drifts from src/ffi.rs.
  c-header-freshness:
    name: C header freshness (cbindgen)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: mobile-cbindgen

      - name: Install cbindgen
        run: cargo install cbindgen --locked

      - name: Regenerate header from src/ffi.rs
        run: bash scripts/gen-header.sh

      - name: Fail if committed header is stale
        run: |
          if ! git diff --exit-code include/genesisdb.h; then
            echo "::error::include/genesisdb.h is out of date with src/ffi.rs. Run scripts/gen-header.sh and commit the result." >&2
            exit 1
          fi

  # Same shape as c-header-freshness above, for the same reason. The iOS Swift
  # SDK sources are copied into react-native-genesisdb's pod (npm cannot ship
  # `ios/genesisdb` — it sits above the package root — so the pod has to carry
  # its own copy or it fails with "no such module 'GenesisDB'"). Committed
  # copies can drift silently from the originals; this gate makes that a hard
  # failure instead. See scripts/vendor-rn-ios-sdk.mjs for the full rationale.
  rn-ios-vendor-freshness:
    name: RN iOS vendored sources freshness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Re-vendor the iOS SDK sources
        run: node scripts/vendor-rn-ios-sdk.mjs

      - name: Fail if the vendored copies are stale
        run: |
          if ! git diff --exit-code react-native-genesisdb/ios/vendor/; then
            echo "::error::react-native-genesisdb/ios/vendor/ is out of date with ios/genesisdb/Sources/. Run 'node scripts/vendor-rn-ios-sdk.mjs' and commit the result." >&2
            exit 1
          fi

  # The gate that would actually have caught the original bug. Freshness above
  # only proves the copies match their originals; this proves they COMPILE in
  # the shape the pod builds them: one module, against the PUBLISHED
  # xcframework the podspec downloads — not against a local HEAD build.
  #
  # That distinction is the point. `ios-swift-tests` already covers HEAD Swift
  # vs HEAD engine. What nothing covered was HEAD's vendored Swift against the
  # RELEASED binary a real `pod install` actually links, which is where an
  # `src/ffi.rs` addition that hasn't been re-published would surface.
  #
  # Only the vendored SDK sources are type-checked. GenesisDbModule.swift needs
  # React headers to compile and is out of scope here; its dependency on the
  # SDK is now same-module type references, which a full pod build resolves.
  rn-ios-pod-typecheck:
    name: RN iOS pod sources typecheck (vs published xcframework)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Read the URL + checksum straight out of the podspec rather than pinning
      # them a seventh time: the podspec's values are the ones a real consumer
      # resolves, so this job cannot silently drift away from what ships.
      - name: Fetch the xcframework the podspec pins
        working-directory: react-native-genesisdb
        run: |
          set -euo pipefail
          URL=$(sed -n 's/.*xcframework_zip_url = "\([^"]*\)".*/\1/p' react-native-genesisdb.podspec)
          SHA=$(sed -n 's/.*xcframework_zip_sha256 = "\([^"]*\)".*/\1/p' react-native-genesisdb.podspec)
          if [ -z "$URL" ] || [ -z "$SHA" ]; then
            echo "::error::could not read xcframework_zip_url / xcframework_zip_sha256 from the podspec"
            exit 1
          fi
          echo "url: $URL"
          curl -fsSL "$URL" -o xcf.zip
          echo "$SHA  xcf.zip" | shasum -a 256 -c -
          unzip -q xcf.zip

      - name: Typecheck the vendored SDK sources against it
        working-directory: react-native-genesisdb
        run: |
          set -euo pipefail
          HEADERS=GenesisBlockDB.xcframework/ios-arm64-simulator/Headers
          test -f "$HEADERS/module.modulemap" || {
            echo "::error::$HEADERS/module.modulemap is missing — the xcframework does not vend a Clang module, so 'import GenesisBlockDB' cannot resolve."
            exit 1
          }
          xcrun swiftc -typecheck \
            -target arm64-apple-ios15.0-simulator \
            -sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)" \
            -I "$HEADERS" \
            ios/vendor/*.swift
