name: One-shot fix OpenOptions semantics

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'agent/tech-debt-hardening'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tech-debt-hardening
          fetch-depth: 0
      - name: Patch lock-file open semantics
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/lib.rs')
          text = path.read_text(encoding='utf-8')
          pattern = re.compile(
              r"(let lock_file = FileOpenOptions::new\(\)\s*"
              r"\.read\(true\)\s*"
              r"\.write\(true\)\s*"
              r"\.create\(true\))(\s*\.open\(&lock_path\))"
          )
          updated, count = pattern.subn(r"\1\n            .truncate(false)\2", text, count=1)
          if count != 1:
              raise SystemExit(f'expected one lock-file OpenOptions block, found {count}')
          path.write_text(updated, encoding='utf-8')
          PY
      - name: Remove one-shot workflow and commit
        run: |
          git rm .github/workflows/one-shot-fix-open-options.yml
          git add src/lib.rs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(storage): preserve database lock file contents explicitly"
          git push origin HEAD:agent/tech-debt-hardening
