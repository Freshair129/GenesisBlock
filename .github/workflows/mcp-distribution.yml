name: MCP Distribution

on:
  pull_request:
    paths:
      - 'package.json'
      - 'mcp/**'
      - 'scripts/check-mcp-package.mjs'
      - '.github/workflows/mcp-distribution.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install JavaScript dependencies without native build hooks
        run: npm ci --ignore-scripts

      - name: Verify npm payload contains the MCP executable and implementation
        run: node scripts/check-mcp-package.mjs

      - name: Run MCP tests
        run: node --test __test__/mcp.test.mjs
