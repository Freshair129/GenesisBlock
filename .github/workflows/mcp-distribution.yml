name: MCP Distribution

on:
  pull_request:
    paths:
      - 'package.json'
      - 'mcp/**'
      - 'scripts/check-mcp-package.mjs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/**'
      - '.github/workflows/mcp-distribution.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: mcp-distribution

      - name: Install JavaScript dependencies without native build hooks
        run: npm ci --ignore-scripts

      - name: Verify npm payload contains the MCP executable and implementation
        run: node scripts/check-mcp-package.mjs

      - name: Build native addon for MCP tests
        run: npm run build

      - name: Run MCP tests
        run: node --test __test__/mcp.test.mjs

      - name: Install the packed artifact in a clean external consumer
        shell: bash
        run: |
          set -euo pipefail
          PACK_FILE=$(npm pack --json | node -e '
            let s = "";
            process.stdin.on("data", d => s += d);
            process.stdin.on("end", () => console.log(JSON.parse(s)[0].filename));
          ')
          PACK_PATH="$PWD/$PACK_FILE"
          CONSUMER="$RUNNER_TEMP/npm-consumer"
          mkdir -p "$CONSUMER"
          cd "$CONSUMER"
          npm init -y >/dev/null
          npm install "$PACK_PATH" --ignore-scripts

          test -x node_modules/.bin/genesisblock-mcp

          node --input-type=module <<'NODE'
          import binding from '@freshair129/gks-genesis-block-native';
          import path from 'node:path';

          const { GenesisDatabase } = binding;
          const db = GenesisDatabase.open({
            path: path.resolve('./consumer-db'),
            vectorDim: 4,
          });
          const node = await db.addNode({
            id: 'npm-consumer-smoke',
            labels: ['DistributionSmoke'],
            embedding: [1, 0, 0, 0],
          });
          if (node.id !== 'npm-consumer-smoke') {
            throw new Error(`unexpected node id: ${node.id}`);
          }
          await db.saveState();
          console.log('clean npm consumer round trip:', node.id);
          NODE
