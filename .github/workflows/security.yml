# Dependency vulnerability gate: audits Cargo.lock against the RustSec advisory
# database on every push/PR to main, and weekly to catch newly-disclosed CVEs in
# already-pinned dependencies.
#
# Requires Cargo.lock to be committed (it is, as of the beta cut).

name: Security Audit

on:
  push:
    branches: [ main ]
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '.github/workflows/security.yml'
  pull_request:
    branches: [ main ]
  schedule:
    # Weekly, Monday 06:00 UTC — surfaces advisories filed against pinned deps.
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  audit:
    name: cargo audit (RustSec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: RustSec advisory audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Ignored advisories are UNMAINTAINED-type only — never real vulnerabilities.
          # Review this list on every security failure. If an entry is missing a justification
          # below, treat it as expired and revalidate before adding it back.
          #
          # RUSTSEC-2025-0141  bincode 1.3.3 — team ceased development (doxxing incident 2025-12).
          #                    Replacement is a large refactor (WAL encoding + snapshots + tests);
          #                    tracked as a follow-up. See docs/adr/ADR--ENGINE-WEDGE-FIRST.md.
          # RUSTSEC-2026-0204  crossbeam-epoch 0.9.18 — transitive (dashmap/crossbeam-channel);
          #                    unmaintained flag, not a vulnerability; upstream migration pending.
          ignore: RUSTSEC-2025-0141,RUSTSEC-2026-0204
