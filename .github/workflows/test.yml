# Real test gate: runs the actual test suites on every PR and push to main.
#
# This is the correctness gate (distinct from benchmarks.yml, which is a perf
# audit). A red run here MUST block merge — no `continue-on-error`, no silent
# `exit 0` skips.
#
# Platform note: the storage core is decoupled from the napi bindings (the
# `napi-bindings` feature, default-on, gates the cdylib surface). `cargo test
# --no-default-features` builds the core + integration tests with NO napi_*
# symbols, so the Rust tests link and run on all three platforms including Linux.
# `npm test` exercises the napi cdylib path at runtime on all three.

name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  docs-validation:
    name: documentation validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate documentation registry, metadata, and links
        run: npm run docs:validate

  version-consistency:
    name: version consistency (SSOT)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Fails if Cargo.toml / package.json / modules.json disagree on the engine
      # version. Keeps the x.y.z[-prerelease] across surfaces in lock-step.
      - name: Check version SSOT
        run: node scripts/version.mjs check

  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --check
      # Both feature configurations are linted. `--no-default-features` covers
      # the storage core / REST server path (no napi_* symbols); the default
      # build additionally compiles the `#[cfg(feature = "napi-bindings")]`
      # cdylib surface, which the core-only run never sees. Linting only one of
      # them let two clippy errors sit undetected in napi-gated code on main
      # (`src/lib.rs` has `#![deny(clippy::all)]`, so they were hard errors).
      - name: cargo clippy (core, no napi)
        run: cargo clippy --no-default-features --all-targets -- -D warnings
      - name: cargo clippy (default, napi bindings on)
        run: cargo clippy --all-targets -- -D warnings

  rust-tests:
    name: cargo test (${{ matrix.host }})
    runs-on: ${{ matrix.host }}
    strategy:
      fail-fast: false
      matrix:
        host: [ ubuntu-latest, windows-latest, macos-latest ]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # --no-default-features drops the napi bindings so the integration tests
      # link as plain native binaries (no napi_* symbols) — works on Linux too.
      - name: cargo test (core, no napi)
        run: cargo test --no-default-features

  node-tests:
    name: npm test (${{ matrix.host }})
    runs-on: ${{ matrix.host }}
    strategy:
      fail-fast: false
      matrix:
        host: [ ubuntu-latest, windows-latest, macos-latest ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # --ignore-scripts so `prepare` doesn't double-build; we build explicitly.
      - name: Install deps (no build)
        run: npm ci --ignore-scripts
      # `napi build` REWRITES index.d.ts / index.js in place. Both are committed
      # (a fresh clone and every registry consumer must be able to require() the
      # package before any local build), so keep the committed copies aside now —
      # after the build they are gone.
      - name: Snapshot the committed napi artifacts
        run: |
          mkdir -p .dts-committed
          cp index.d.ts index.js .dts-committed/
      - name: Build native addon
        run: npm run build
      # Only on one host: the committed files must match ONE canonical generator
      # output, and comparing three would turn any per-platform generation
      # difference into three red jobs. That also means a platform-specific
      # difference in what napi emits is NOT covered here — index.js enumerates
      # every target from package.json rather than the build host, so it is not
      # expected to vary, but that is reasoning, not a measurement.
      - name: index.d.ts / index.js freshness
        if: matrix.host == 'ubuntu-latest'
        run: node scripts/check-dts-freshness.mjs .dts-committed .
      - name: npm test
        run: npm test
