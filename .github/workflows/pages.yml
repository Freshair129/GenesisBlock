# Publish the static benchmark/landing page (site/) to GitHub Pages.
#
# workflow_dispatch ONLY — this is publish-PREP, not auto-publish. There is no
# push trigger: merging to main does NOT deploy anything. A maintainer decides
# when to publish by running this workflow manually from the Actions tab.
#
# One-time setup (still required even after a manual run succeeds once): repo
# Settings → Pages → Source = "GitHub Actions". Until that is enabled, a
# manual run will fail at the deploy-pages step with a clear error; nothing is
# exposed publicly before then.
name: Deploy site to Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
