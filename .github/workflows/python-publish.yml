name: Publish Python SDK to PyPI

on:
  push:
    tags:
      - 'python-v*'
  workflow_dispatch:
    inputs:
      verify_version:
        description: "Optional already-published genesisblockdb-client version to install in a clean consumer"
        required: false
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build and publish genesisblockdb-client
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify release tag matches package version
        if: ${{ github.event_name == 'push' }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(python - <<'PY'
          import pathlib, tomllib
          data = tomllib.loads(pathlib.Path('genesisdb-python/pyproject.toml').read_text(encoding='utf-8'))
          print(data['project']['version'])
          PY
          )
          EXPECTED="python-v${VERSION}"
          if [ "$GITHUB_REF_NAME" != "$EXPECTED" ]; then
            echo "tag/package mismatch: tag=$GITHUB_REF_NAME expected=$EXPECTED" >&2
            exit 1
          fi
          echo "release tag matches genesisblockdb-client ${VERSION}"

      - name: Build wheel + sdist
        run: |
          python -m pip install --upgrade pip build twine
          python -m build genesisdb-python
          python -m twine check genesisdb-python/dist/*

      - name: Inspect artifacts
        run: ls -lh genesisdb-python/dist

      - name: Report workflow_dispatch dry run
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          echo "DRY RUN: wheel and sdist built and checked; PyPI publishing is enabled only for python-v* tag pushes."

      # Requires a one-time PyPI Trusted Publisher binding for this repository,
      # workflow filename, and the `pypi` GitHub Environment. No long-lived API
      # token is stored in GitHub.
      - name: Publish to PyPI with Trusted Publishing
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/python-v') }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: genesisdb-python/dist/


      - name: Verify the published package from a clean PyPI consumer
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/python-v') || github.event_name == 'workflow_dispatch' && inputs.verify_version != '' }}
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.verify_version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            VERSION="${GITHUB_REF_NAME#python-v}"
          else
            VERSION="$REQUESTED_VERSION"
          fi
          CONSUMER="$RUNNER_TEMP/pypi-registry-consumer"
          python -m venv "$CONSUMER"
          source "$CONSUMER/bin/activate"
          python -m pip install --upgrade pip
          for attempt in $(seq 1 12); do
            if python -m pip install --no-cache-dir "genesisblockdb-client==$VERSION"; then
              break
            fi
            if [[ "$attempt" -eq 12 ]]; then
              echo "could not install genesisblockdb-client==$VERSION from PyPI" >&2
              exit 1
            fi
            sleep 5
          done
          EXPECTED_VERSION="$VERSION" python - <<'PY'
          import os
          from importlib.metadata import version
          from genesisdb import GenesisClient

          actual = version('genesisblockdb-client')
          assert actual == os.environ['EXPECTED_VERSION'], (actual, os.environ['EXPECTED_VERSION'])
          assert GenesisClient
          print('clean PyPI registry consumer installed:', actual)
          PY
