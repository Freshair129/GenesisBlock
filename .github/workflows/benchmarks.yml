name: GenesisBlockDB Performance Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  benchmark:
    name: Scientific Performance Audit
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Benchmark (Standalone Release)
        # The storage core has a no-napi feature mode so audit bins link as
        # standalone Linux executables. A failed build must fail this required
        # performance check rather than silently producing no evidence.
        run: cargo build --release --no-default-features --features bins --bin scientific-audit

      - name: Run Scientific Audit (15s Durable fsync)
        run: |
          test -x ./target/release/scientific-audit || { echo "❌ scientific-audit was not built"; exit 1; }
          mkdir -p benches/scientific_audit_db
          ./target/release/scientific-audit > audit_result.txt
          cat audit_result.txt
          test -s audit_result.txt || { echo "❌ scientific audit produced no result"; exit 1; }

      - name: Upload Audit Artifact
        if: hashFiles('audit_result.txt') != ''
        uses: actions/upload-artifact@v4
        with:
          name: genesisdb-audit-report
          path: audit_result.txt

      - name: Performance Regression Check
        run: |
          test -s audit_result.txt || { echo "❌ benchmark result is missing"; exit 1; }
          RATE=$(awk '/Ingestion rate:/ {print int($3); exit}' audit_result.txt)
          test -n "$RATE" || { echo "❌ benchmark result has no ingestion-rate measurement"; exit 1; }
          if [ "$RATE" -lt 100 ]; then
            echo "❌ Performance Regression Detected! Ingestion rate dropped below 100 nodes/sec."
            exit 1
          fi
          echo "✅ Performance verified: $RATE nodes/sec (Durable)"
