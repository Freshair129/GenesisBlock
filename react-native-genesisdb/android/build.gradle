// react-native-genesisdb Android module (MARK XVI Phase B-3).
//
// Thin RN bridge over io.github.freshair129:genesisdb-android (Phase B-2) —
// this module holds NO JNI declarations of its own. It cannot bind directly to the
// `Java_dev_genesisblock_GenesisDB_native*` symbols (those are resolved by
// the calling class's fully-qualified name, `dev.genesisblock.GenesisDB`),
// so it depends on that real class and never touches the native handle
// itself; see GenesisDbModule.kt.
//
// This module is validated by building it inside a real RN host app, not by
// this monorepo's CI — there is no host app here to resolve
// `com.facebook.react:react-android` against, mirroring the existing
// host-only scope carved out for B-1 (iOS) in docs/SPEC--MOBILE-SDK.md.
apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'kotlinx-serialization'

android {
    namespace "dev.genesisblock.reactnative"
    compileSdkVersion 34

    defaultConfig {
        minSdkVersion 24
        targetSdkVersion 34
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

repositories {
    google()
    mavenCentral()

    // mavenCentral() is now enough. genesisdb-android is published to Maven
    // Central under io.github.freshair129, so it resolves anonymously.
    //
    // The GitHub Packages repository this file used to declare (with
    // `gpr.user`/`gpr.key` credentials) is deliberately GONE rather than kept
    // as a fallback: GitHub Packages requires authentication for every read
    // even on a public repo, which was the entire problem, and leaving it here
    // would let a broken Central resolution pass silently on a machine that
    // happens to have a token. Central is the only source now, so
    // rn-host-acceptance proves a consumer needs no credential at all.
}

dependencies {
    // Supplied by the RN host app's own dependency graph; compileOnly avoids
    // pulling a second copy into the final APK.
    compileOnly "com.facebook.react:react-android:+"

    // The genesisdb-android .aar (Phase B-2), from Maven Central.
    //
    // Note the groupId is io.github.freshair129 while the Kotlin package
    // stays dev.genesisblock: a Maven coordinate and a JVM package are
    // independent, and renaming the package would break every JNI entry
    // point, since those symbols mangle from the class's FQCN
    // (`Java_dev_genesisblock_GenesisDB_native*`). So the import in
    // GenesisDbModule.kt is unchanged by this move.
    //
    // Do NOT also declare dev.genesisblock:genesisdb-android (the GitHub
    // Packages coordinate, still published by release.yml for existing
    // consumers): Gradle sees two different modules carrying the same
    // classes, and the app fails on duplicate classes rather than on a
    // version conflict it could resolve.
    //
    // For local monorepo development: `./gradlew :genesisdb:publishToMavenLocal`
    // from ../../android and add `mavenLocal()` to the consuming app.
    // 0.1.1 added the x86_64 slice, which is what makes this package usable
    // in an Android Studio emulator on a Windows or Linux host — 0.1.0 shipped
    // only the two ARM ABIs.
    implementation "io.github.freshair129:genesisdb-android:0.1.1"
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.3"
}
