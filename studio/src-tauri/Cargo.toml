[package]
name = "genesis-studio"
version = "0.1.0"
description = "Desktop controller for GenesisBlockDB"
authors = ["GenesisBlockDB contributors"]
edition = "2021"

[lib]
name = "genesis_studio_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
genesis-block-native = { path = "../..", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
