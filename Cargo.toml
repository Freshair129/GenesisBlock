[package]
name = "genesis-block-native"
version = "0.0.1"
edition = "2021"
description = "Genesis Block — high-performance hybrid semantic-graph engine"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# `bins` gates the standalone server + benchmark executables. Each one links the
# napi-using lib, so it cannot link as a standalone binary during the default
# `cargo build` / `napi build` — `napi_*` symbols (e.g. napi_get_cb_info) are only
# provided by the Node host for the cdylib. Keeping the bins behind an off-by-
# default feature lets `npm install` (napi build) compile ONLY the .node cdylib,
# while `cargo build --features bins` still builds them for benchmarks/dev.
bins = []

[dependencies]
napi = { version = "2.16", default-features = false, features = ["napi8", "async", "serde-json"] }
napi-derive = "2.16"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
tokio = { version = "1", features = ["full"] }
md5 = "0.7"
regex = "1"
dashmap = "6.0"
once_cell = "1.19"
parking_lot = "0.12"
sysinfo = "0.30"
bincode = "1.3"
hnsw_rs = "0.3.4"
axum = "0.7"
tower-http = { version = "0.5", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
csv = "1.4.0"
rayon = "1.12.0"
twox-hash = "2.1.2"
rand = { version = "0.8", features = ["std"] }
crossbeam-channel = "0.5.15"
pest = "2.7"
pest_derive = "2.7"
strsim = "0.11"
sha2 = "0.10"
hex = "0.4"
unicode-general-category = "1.1.0"
ed25519-dalek = { version = "2.2.0", features = ["serde"] }
roaring = "0.10"

[build-dependencies]
napi-build = "2.1"

[[bin]]
name = "genesis-db-server"
path = "src/main.rs"
required-features = ["bins"]

[[bench]]
name = "ldbc_lite"
harness = false

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"

[dev-dependencies]
anyhow = "1.0.102"
criterion = "0.8.2"
rand = "0.8"
tempfile = "3.27.0"
tower = { version = "0.4", features = ["util"] }
http-body-util = "0.1"

[[bin]]
name = "snb-ingestion"
path = "benches/snb_ingestion.rs"
required-features = ["bins"]


[[bin]]
name = "snb-bulk-ingestion"
path = "benches/snb_bulk_ingestion.rs"
required-features = ["bins"]


[[bin]]
name = "shadow-sync-stress"
path = "benches/shadow_sync_stress.rs"
required-features = ["bins"]


[[bin]]
name = "hql-query-stress"
path = "benches/hql_query_stress.rs"
required-features = ["bins"]


[[bin]]
name = "industrial-audit"
path = "benches/industrial_audit.rs"
required-features = ["bins"]


[[bin]]
name = "scientific-audit"
path = "benches/scientific_audit.rs"
required-features = ["bins"]


[[bin]]
name = "vbench-genesis"
path = "benches/vbench_genesis.rs"
required-features = ["bins"]


[[bin]]
name = "graph-bench"
path = "benches/graph_bench.rs"
required-features = ["bins"]


[[bin]]
name = "gov-kimpact-bench"
path = "benches/gov_kimpact_bench.rs"
required-features = ["bins"]


[[bin]]
name = "edge-interning-audit"
path = "benches/edge_interning_audit.rs"
required-features = ["bins"]

