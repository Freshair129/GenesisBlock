# cbindgen config for the mobile C ABI (src/ffi.rs → include/genesisdb.h).
#
# The header is the contract the iOS xcframework (and any C/Swift caller) links
# against. It is GENERATED, committed, and verified fresh in CI (mobile-build.yml
# runs cbindgen and diffs against the committed copy), so do not hand-edit it.
#
# Regenerate after changing any `genesisdb_*` signature in src/ffi.rs:
#   cbindgen --config cbindgen.toml --crate genesis-block-native \
#            --output include/genesisdb.h
# (the wrapper scripts/gen-header.sh does exactly this).

language = "C"
header = "/* GenesisBlockDB mobile C ABI — generated from src/ffi.rs. */"
autogen_warning = "/* DO NOT EDIT: generated by cbindgen from src/ffi.rs. Run scripts/gen-header.sh. */"
include_guard = "GENESISDB_H"
pragma_once = false
cpp_compat = true
documentation = true
documentation_style = "c"
style = "type"
no_includes = false
sys_includes = ["stdint.h"]

[parse]
# The FFI lives in this crate only; no need to descend into dependencies.
parse_deps = false

[export]
# GenesisHandle is only ever referenced behind a pointer, so emit it as an
# opaque forward declaration rather than dropping it.
include = ["GenesisHandle"]
# The `.a` is always built with `--features ffi`, so the genesisdb_* symbols are
# unconditionally present — no `#if defined(...)` guard. Drop unrelated crate
# pub items that cbindgen would otherwise sweep in (only the C ABI belongs here).
exclude = ["SCHEMA_VERSION", "SIDECAR_CACHE_ROWS"]
